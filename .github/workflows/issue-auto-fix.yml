name: Auto-Fix Issue with Claude Code

# Runs only when a maintainer adds the label "auto-fix" to an issue (or starts it by hand).
# Adding a label needs triage access or more, and the job also checks that the sender has
# write, maintain or admin permission. The label means "I read this issue and trust its text":
# the issue body goes to an agent that runs without permission prompts.
#
# Untrusted text (issue title and body) never goes into a `run:` script through `${{ }}`.
# It goes through env vars and files only.
#
# Auto-merge (repo variable ISSUE_AUTO_FIX_MERGE=yes) only turns on GitHub auto-merge.
# GitHub then merges when the branch protection rules of main are met. Before you set the
# variable, protect main with required status checks (the test workflow) and at least one
# approving review. Without protection on main this job does not turn on auto-merge.
# Set PAT_TOKEN: a PR opened with GITHUB_TOKEN does not start other workflows, so its
# required checks never run and it never merges.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process manually'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-auto-fix-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  auto-fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'auto-fix'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUM: ${{ github.event.issue.number || github.event.inputs.issue_number }}

    steps:
      - name: Check sender permission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          case "$ISSUE_NUM" in ''|*[!0-9]*) echo "bad issue number"; exit 1;; esac
          # .permission is admin, write (also for maintain), read (also for triage) or none
          PERM=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission)
          case "$PERM" in
            admin|write) echo "$SENDER has $PERM permission" ;;
            *) echo "$SENDER has '$PERM' permission, write or more is needed"; exit 1 ;;
          esac

      - name: Fetch issue data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$REPO/issues/$ISSUE_NUM" > /tmp/issue.json
          {
            echo "Issue #$ISSUE_NUM: $(jq -r .title /tmp/issue.json)"
            echo
            echo "Description:"
            jq -r '.body // ""' /tmp/issue.json
          } > /tmp/issue-context.txt

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The agent must not get a push token through .git/config
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Configure Git
        id: gitcfg
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Automated Claude Code"
          git checkout -b "fix/issue-$ISSUE_NUM"
          # A step output cannot be changed by later steps (files in /tmp or GITHUB_ENV can)
          echo "sha=$(sha256sum .git/config | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to fix issue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          CLAUDE_CODE_USE_BEDROCK: 1
          CLAUDE_FIX_MODEL: ${{ vars.CLAUDE_FIX_MODEL || 'opus' }}
        run: |
          {
            echo "# Fix GitHub Issue"
            echo
            echo "Please analyze and fix the following issue:"
            echo
            cat /tmp/issue-context.txt
            cat <<'PROMPT_EOF'

          ## Your Task
          1. Analyze the issue
          2. Make necessary changes to fix it (use Edit tool to modify files)
          3. Keep changes minimal and focused
          4. Test your changes if possible

          When done, I will automatically commit and create a PR.
          PROMPT_EOF
          } > /tmp/fix-prompt.md

          # Run Claude Code with stdin in fully automated mode
          claude --dangerously-skip-permissions --model "$CLAUDE_FIX_MODEL" < /tmp/fix-prompt.md

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CFG_SHA: ${{ steps.gitcfg.outputs.sha }}
        run: |
          # The agent could plant hooks or a url.insteadOf in .git that leak the token here
          if [ "$(sha256sum .git/config | cut -d' ' -f1)" != "$CFG_SHA" ]; then
            echo ".git/config changed during the agent run: not pushing"; exit 1
          fi
          git -c core.hooksPath=/dev/null add -A
          git -c core.hooksPath=/dev/null commit -m "fix: Resolve issue #$ISSUE_NUM"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "fix/issue-$ISSUE_NUM"

      - name: Create Pull Request
        if: steps.changes.outputs.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE=$(jq -r .title /tmp/issue.json)
          PR_BODY=$(printf '## Automated Fix\n\nThis PR automatically addresses issue #%s.\n\n**Issue**: %s\n\nPlease review and merge if the fix looks good.\n\nFixes #%s\n' \
            "$ISSUE_NUM" "$ISSUE_TITLE" "$ISSUE_NUM")

          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --head "fix/issue-$ISSUE_NUM" \
            --base main \
            --title "Fix: Resolve issue #$ISSUE_NUM" \
            --body "$PR_BODY")
          echo "Created PR: $PR_URL"

          gh issue comment "$ISSUE_NUM" --repo "$REPO" \
            --body "PR created with automated fix: $PR_URL - Please review!"
          gh issue close "$ISSUE_NUM" --repo "$REPO" \
            --comment "Automated fix completed. Closing this issue as PR $PR_URL has been created with the solution."

      # Auto-merge: set repository variable ISSUE_AUTO_FIX_MERGE=yes. See the notes at the top.
      - name: Enable auto-merge
        if: steps.changes.outputs.HAS_CHANGES == 'true' && vars.ISSUE_AUTO_FIX_MERGE == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh api "repos/$REPO/branches/main" --jq .protected)" != "true" ]; then
            echo "main has no branch protection: not enabling auto-merge"
            exit 0
          fi
          # --auto waits for the required checks and reviews of main; it never merges past them
          gh pr merge "fix/issue-$ISSUE_NUM" --repo "$REPO" --auto --squash --delete-branch

      - name: Comment if no changes
        if: steps.changes.outputs.HAS_CHANGES == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$REPO" \
            --body "No changes were needed. The issue may already be resolved or requires manual intervention."
