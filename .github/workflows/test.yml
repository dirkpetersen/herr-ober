name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install config validators (haproxy, keepalived, netplan, ExaBGP 4.2 and 5.0)
        run: |
          sudo add-apt-repository -y ppa:vbernat/haproxy-3.3
          sudo apt-get update
          sudo apt-get install -y haproxy keepalived netplan.io
          python -m venv "$RUNNER_TEMP"/exabgp42 && "$RUNNER_TEMP"/exabgp42/bin/pip install -q "exabgp>=4.2,<4.3"
          python -m venv "$RUNNER_TEMP"/exabgp50 && "$RUNNER_TEMP"/exabgp50/bin/pip install -q "exabgp>=5.0,<5.1"
          echo "OBER_TEST_EXABGP=$RUNNER_TEMP/exabgp42/bin/exabgp:$RUNNER_TEMP/exabgp50/bin/exabgp" >> "$GITHUB_ENV"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy ober/

      - name: Run tests with coverage
        run: |
          pytest --cov=ober --cov-report=xml --cov-report=term-missing

      - name: Check generated keepalived config as root
        run: |
          sudo -E "$(which python)" -m pytest -p no:cacheprovider tests/test_golden_render.py -k keepalived -rs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
